name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: v0.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The 'tools' package no longer exists in the SDK repo; only install
          # platform-tools and let Gradle fetch platforms/build-tools.
          packages: 'platform-tools'

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set for this repository." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pi-mobile.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pi-mobile.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Write update manifest
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          NAME="pi-remote-${ANDROID_VERSION_NAME}.apk"
          cp "$APK" "$NAME"
          SHA=$(sha256sum "$NAME" | awk '{print $1}')
          SIZE=$(stat -c%s "$NAME")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${NAME}"
          cat > latest.json <<JSON
          {
            "versionCode": ${ANDROID_VERSION_CODE},
            "versionName": "${ANDROID_VERSION_NAME}",
            "buildType": "release",
            "fileName": "${NAME}",
            "url": "${URL}",
            "sizeBytes": ${SIZE},
            "sha256": "${SHA}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commitSha": "${GITHUB_SHA}",
            "commitUrl": "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          }
          JSON
          cat latest.json

      - name: Drop previous rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-build --yes --cleanup-tag || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body: |
            Automatic build from ${{ github.sha }}.

            versionCode `${{ github.run_number }}` · versionName `v0.0.${{ github.run_number }}`
          make_latest: true
          files: |
            pi-remote-v0.0.${{ github.run_number }}.apk
            latest.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-remote-apk
          path: pi-remote-*.apk
          if-no-files-found: error
